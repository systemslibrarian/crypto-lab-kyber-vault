name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: demos/kyber-vault/package-lock.json
      # The hosted dependency-review API requires the repository dependency
      # graph to be enabled. Audit the complete proposed lockfile instead, so
      # this remains a mandatory fail-closed PR gate on every repository tier.
      - name: Install proposed dependency graph without lifecycle scripts
        working-directory: demos/kyber-vault
        run: npm ci --ignore-scripts
      - name: Reject moderate-or-higher vulnerabilities
        working-directory: demos/kyber-vault
        run: npm audit --audit-level=moderate

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: demos/kyber-vault/package-lock.json

      - name: Verify immutable Action references
        run: node scripts/verify-workflow-pins.mjs

      - name: Install dependencies
        working-directory: demos/kyber-vault
        run: npm ci

      - name: Dependency vulnerability gate
        working-directory: demos/kyber-vault
        run: npm run audit

      - name: Run tests
        working-directory: demos/kyber-vault
        run: npm test

      - name: Build
        working-directory: demos/kyber-vault
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Install Playwright browser
        working-directory: demos/kyber-vault
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        working-directory: demos/kyber-vault
        run: npm run test:a11y

      - name: Generate CycloneDX SBOM
        working-directory: demos/kyber-vault
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Preserve SBOM as build evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kyber-vault-sbom
          path: demos/kyber-vault/sbom.cdx.json
          if-no-files-found: error

      - name: Build root-based Lighthouse target
        working-directory: demos/kyber-vault
        run: npm run build:lighthouse

      - name: Lighthouse quality budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./demos/kyber-vault/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: demos/kyber-vault/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Dependabot only. A bump can merge itself only after dependency review and
  # the complete build/browser/Lighthouse gate are green. Routine minor/patch
  # bumps are grouped; majors arrive separately so failures remain attributable.
  dependabot-auto-merge:
    needs: [dependency-review, build]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      # The gate judges any individual major too; a breaking one remains open.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
